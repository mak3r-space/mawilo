<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mawilo Theatre</title>
  <link rel="stylesheet" href="style.css">
  <script src="main.js" defer></script>
</head>
<body>
  <main class="theatre">
    <div class="stage" id="stage">
      <div class="wall layer" data-depth="0.15"></div>
      <div class="floor layer" data-depth="0.3"></div>
      <div class="row layer back" data-depth="0.35" data-row="back"></div>
      <div class="row layer mid" data-depth="0.6" data-row="mid"></div>
      <div class="row layer front" data-depth="1" data-row="front"></div>
      <div class="peekers layer" data-depth="1.2" id="peekers"></div>
    </div>
  </main>
</body>
</html>
