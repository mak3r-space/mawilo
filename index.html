<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MaWiLos</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&family=Slackey&display=swap">
  <link rel="stylesheet" href="style.css">
  <script src="data.js" defer></script>
  <script src="main.js" defer></script>
</head>
<body>
  <h1 class="title" id="title"><span class="title-text">MaWiLos</span></h1>
  <main class="board" id="board" aria-label="MaWiLos you can drag around"></main>
  <nav class="line" id="line" aria-label="All MaWiLos">
    <div class="line-inner" id="line-inner">
      <svg class="string" id="string" aria-hidden="true"><path fill="none" /></svg>
    </div>
  </nav>

  <div class="card" id="card" role="dialog" aria-modal="true" aria-labelledby="card-title" hidden>
    <button class="card-close" id="card-close" type="button" aria-label="Close">×</button>
    <button class="card-step prev" id="card-prev" type="button" aria-label="Previous MaWiLo">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /></svg>
    </button>
    <button class="card-step next" id="card-next" type="button" aria-label="Next MaWiLo">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /></svg>
    </button>
    <div class="card-picture">
      <div class="card-flip" id="card-flip">
        <figure class="card-photo front on-top">
          <img id="card-img" alt="">
          <h2 id="card-title"></h2>
        </figure>
        <figure class="card-photo back" aria-hidden="true">
          <img id="card-img-back" alt="">
          <span class="card-photo-name" id="card-title-back"></span>
        </figure>
      </div>
    </div>
    <div class="card-text">
      <p class="card-description" id="card-description"></p>
      <p class="card-story" id="card-story"></p>
      <p class="card-fabrics" id="card-fabrics"></p>
      <button class="card-toggle" id="card-toggle" type="button">see the photo</button>
    </div>
  </div>
</body>
</html>
