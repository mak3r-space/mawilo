<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mawilos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Slackey&display=swap">
  <link rel="stylesheet" href="style.css">
  <script src="data.js" defer></script>
  <script src="main.js" defer></script>
</head>
<body>
  <h1 class="title" id="title"><span class="title-text">Mawilos</span></h1>
  <main class="board" id="board" aria-label="Mawilos you can drag around"></main>
  <p class="hint" id="hint">drag from the middle, turn by the edges, tap to meet one</p>
  <button class="reset" id="reset" type="button" aria-label="Reset layout" title="Reset layout">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
      <path d="M4 12a8 8 0 1 0 2.4-5.7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
      <path d="M4 3v5h5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </button>
  <select class="font-picker" id="font-picker" aria-label="Body font" hidden></select>

  <div class="card" id="card" role="dialog" aria-modal="true" aria-labelledby="card-title" hidden>
    <button class="card-close" id="card-close" type="button" aria-label="Close">×</button>
    <div class="card-picture">
      <img id="card-img" alt="">
    </div>
    <div class="card-text">
      <h2 id="card-title"></h2>
      <p class="card-description" id="card-description"></p>
      <p class="card-fabrics" id="card-fabrics"></p>
      <p class="card-story" id="card-story"></p>
      <button class="card-toggle" id="card-toggle" type="button">see the photo</button>
    </div>
  </div>
</body>
</html>
